<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Crossover Zone - Episodes</title>
  <link rel="stylesheet" href="css/portal.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 70px 20px 50px;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 40%, rgba(98, 40, 158, 0.32), transparent 28%),
        radial-gradient(ellipse at 20% 80%, rgba(25, 112, 180, 0.28), transparent 35%),
        radial-gradient(ellipse at 85% 15%, rgba(165, 55, 150, 0.24), transparent 32%),
        linear-gradient(135deg, #060818 0%, #11113a 48%, #08091d 100%) fixed;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -50%;
      pointer-events: none;
    }

    body::before {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(160,195,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,220,180,.75) 0 1.2px, transparent 1.8px);
      background-size: 160px 160px, 230px 230px, 310px 310px;
      background-position: 20px 30px, 80px 100px, 140px 50px;
      opacity: .8;
    }

    body::after {
      background:
        radial-gradient(circle at 18% 22%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 72% 68%, #cfe1ff 0 1px, transparent 2px),
        radial-gradient(circle at 54% 12%, #ffdcb8 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 88% 34%, #fff 0 1px, transparent 2px),
        radial-gradient(circle at 35% 82%, #fff 0 1.5px, transparent 2.5px);
      filter: drop-shadow(0 0 5px rgba(255,255,255,.8));
    }

    .back-link {
      position: relative;
      z-index: 2;
      display: block;
      width: min(900px, calc(100% - 40px));
      margin: 0 auto 18px;
      color: #ffd76a;
      font-weight: bold;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: #ffffff;
      text-shadow: 0 0 12px #ffd76a;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 44px 52px;
      text-align: center;
      border: 1px solid rgba(183, 210, 255, .24);
      border-radius: 24px;
      background: rgba(5, 7, 29, .66);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .45), inset 0 0 35px rgba(112, 92, 210, .12);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(2.3rem, 7vw, 5rem);
      line-height: 1;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(159, 182, 255, .65);
    }

    h2 {
      margin: 0 0 18px;
      color: #ffd76a;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
    }

    .status {
      max-width: 650px;
      margin: 0 auto;
      padding: 26px 24px;
      border: 1px solid rgba(183, 210, 255, .18);
      border-radius: 16px;
      background: rgba(255, 255, 255, .035);
    }

    .status p {
      margin: 0;
      color: #f4f5ff;
      font-size: clamp(1.08rem, 2.2vw, 1.35rem);
      line-height: 1.75;
    }

    @media (max-width: 600px) {
      body { padding: 30px 10px; }
      main, .back-link { width: calc(100% - 20px); }
      main { padding: 32px 22px; }
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Go back to main site</a>

  <main>
    <h1>Episodes</h1>

    <h2>Season 1</h2>
    <div class="status">
      <p>Episodes are not ready yet. They are currently being planned or being made.</p>
    </div>
  </main>

  <script src="javascript/portal.js" defer></script>
</body>
</html>
